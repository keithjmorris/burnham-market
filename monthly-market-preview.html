<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monthly Market — Stall Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #FAF7F2; color: #1A2E28; }

    .app-header { background: #2C4A3E; padding: 16px 20px; }
    .app-title { font-family: Georgia, serif; font-size: 22px; font-weight: 700; color: white; }
    .app-subtitle { font-size: 11px; color: rgba(255,255,255,0.65); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 2px; }

    .toolbar { background: white; border-bottom: 1px solid #F0EBE1; padding: 12px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .preview-badge { background: #fff3cd; color: #856404; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; border: 1px solid #ffc107; }
    .month-select { padding: 6px 12px; border: 1px solid #F0EBE1; border-radius: 20px; font-size: 13px; font-family: inherit; background: white; color: #2C4A3E; }
    .stall-count { font-size: 12px; color: #8A9E96; margin-left: auto; }

    .filter-bar { display: flex; gap: 8px; padding: 12px 16px; background: white; border-bottom: 1px solid #F0EBE1; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-pill { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1.5px solid #F0EBE1; background: white; color: #4A6B5E; cursor: pointer; white-space: nowrap; }
    .filter-pill.active { background: #2C4A3E; color: white; border-color: #2C4A3E; }

    .stall-list { padding: 16px; display: flex; flex-direction: column; gap: 14px; max-width: 600px; margin: 0 auto; }

    .card { background: white; border-radius: 14px; box-shadow: 0 1px 4px rgba(44,74,62,0.10); overflow: hidden; }
    .card.inactive { opacity: 0.3; }
    .card-top { display: flex; align-items: center; gap: 14px; padding: 14px; }
    .card-image { width: 90px; height: 90px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: #E8F0ED; display: flex; align-items: center; justify-content: center; color: #3D6B5C; }
    .card-info { flex: 1; min-width: 0; }
    .card-name { font-family: Georgia, serif; font-size: 17px; font-weight: 600; color: #1A2E28; margin-bottom: 4px; }
    .card-description { font-size: 13px; color: #4A6B5E; line-height: 1.4; margin-bottom: 6px; }
    .card-tag { font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #2C4A3E; background: #E8F0ED; padding: 2px 8px; border-radius: 20px; display: inline-block; }
    .inactive-badge { font-size: 10px; font-weight: 600; color: #8A9E96; background: #F0EBE1; padding: 2px 8px; border-radius: 20px; display: inline-block; margin-top: 4px; }

    .card-actions { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid #F0EBE1; }
    .card-action-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px 4px; color: #2C4A3E; font-size: 10px; font-weight: 500; border-right: 1px solid #F0EBE1; cursor: pointer; background: none; border-top: none; border-bottom: none; font-family: inherit; }
    .card-action-btn:last-child { border-right: none; }
    .card-action-btn.disabled { opacity: 0.35; pointer-events: none; }
    .card-action-btn svg { width: 20px; height: 20px; stroke: #2C4A3E; }

    .empty-state { text-align: center; padding: 60px 20px; color: #8A9E96; font-size: 15px; }
    .loading { text-align: center; padding: 60px 20px; color: #8A9E96; }
  </style>
</head>
<body>

<div class="app-header">
  <p class="app-title">Burnham Market</p>
  <p class="app-subtitle">Monthly Market — Stall Preview</p>
</div>

<div class="toolbar">
  <span class="preview-badge">⚠️ Admin Preview</span>
  <select class="month-select" id="previewMonth" onchange="renderStalls()">
    <option value="2026-03">March 2026</option>
    <option value="2026-04">April 2026</option>
    <option value="2026-05">May 2026</option>
    <option value="2026-06">June 2026</option>
    <option value="2026-07" selected>July 2026</option>
    <option value="2026-08">August 2026</option>
    <option value="2026-09">September 2026</option>
  </select>
  <span class="stall-count" id="stallCount"></span>
</div>

<div class="filter-bar" id="filterBar"></div>
<div class="stall-list" id="stallList"><div class="loading">Loading stalls…</div></div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAmMoJa-5U6Kzkj3ClL8jYB7Y3pL8ysC04",
    authDomain:        "burnhammarketcraftfair.firebaseapp.com",
    databaseURL:       "https://burnhammarketcraftfair-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:         "burnhammarketcraftfair",
    storageBucket:     "burnhammarketcraftfair.firebasestorage.app",
    messagingSenderId: "388230915965",
    appId:             "1:388230915965:web:93c83d174322c2aab28e14"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let allStalls = [];
  let activeCategory = '';

  db.ref('monthly-market/stalls').once('value', snap => {
    const raw = snap.val();
    allStalls = raw ? Object.values(raw).sort((a,b) => (a.name||'').localeCompare(b.name||'')) : [];
    renderStalls();
  });

  function getCurrentMonth() {
    return document.getElementById('previewMonth').value;
  }

  function renderStalls() {
    const month = getCurrentMonth();
    const list  = document.getElementById('stallList');
    const filterBar = document.getElementById('filterBar');

    // Sort: active first, then inactive
    const sorted = [...allStalls].sort((a, b) => {
      const aActive = a.activeMonths && a.activeMonths.includes(month) ? 0 : 1;
      const bActive = b.activeMonths && b.activeMonths.includes(month) ? 0 : 1;
      return aActive - bActive || (a.name||'').localeCompare(b.name||'');
    });

    // Category filter pills
    const categories = ['All', ...new Set(allStalls.map(s => s.category).filter(Boolean).sort())];
    filterBar.innerHTML = categories.map(cat => `
      <button class="filter-pill ${activeCategory === cat || (cat === 'All' && !activeCategory) ? 'active' : ''}"
        onclick="setCategory('${cat}')">
        ${cat}
      </button>
    `).join('');

    const filtered = activeCategory && activeCategory !== 'All'
      ? sorted.filter(s => s.category === activeCategory)
      : sorted;

    const activeCount = filtered.filter(s => s.activeMonths && s.activeMonths.includes(month)).length;
    document.getElementById('stallCount').textContent = `${activeCount} active · ${filtered.length} total`;

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty-state">No stalls found.</div>';
      return;
    }

    list.innerHTML = filtered.map(stall => {
      const isActive  = stall.activeMonths && stall.activeMonths.includes(month);
      const hasSocial = !!(stall.instagram || stall.facebook);
      const socialUrl = stall.instagram
        ? `https://www.instagram.com/${stall.instagram}`
        : `https://www.facebook.com/${stall.facebook}`;

      return `
        <div class="card ${isActive ? '' : 'inactive'}">
          <div class="card-top">
            <div class="card-image">
              ${stall.image
                ? `<img src="${stall.image}" alt="${stall.name}" style="width:90px;height:90px;object-fit:cover;border-radius:8px;">`
                : `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`
              }
            </div>
            <div class="card-info">
              <p class="card-name">${stall.name || ''}</p>
              <p class="card-description">${(stall.description||'').substring(0,80)}${(stall.description||'').length>80?'…':''}</p>
              ${stall.category ? `<span class="card-tag">${stall.category}</span>` : ''}
              ${!isActive ? `<br><span class="inactive-badge">Not at this month's market</span>` : ''}
            </div>
          </div>
          <div class="card-actions">
            <button class="card-action-btn ${stall.phone ? '' : 'disabled'}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.5 12 19.79 19.79 0 0 1 1.15 3.18 2 2 0 0 1 3.13 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 5.47 5.47l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              Call
            </button>
            <button class="card-action-btn ${stall.website ? '' : 'disabled'}" ${stall.website ? `onclick="window.open('${stall.website}','_blank')"` : ''}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              Website
            </button>
            <button class="card-action-btn ${hasSocial ? '' : 'disabled'}" ${hasSocial ? `onclick="window.open('${socialUrl}','_blank')"` : ''}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
              Social
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  function setCategory(cat) {
    activeCategory = cat === 'All' ? '' : cat;
    renderStalls();
  }
</script>
</body>
</html>
